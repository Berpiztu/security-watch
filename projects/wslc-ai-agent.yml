# wslc-ai-agent: what it is built from, read every day from its own files.
name: wslc-ai-agent
repository: Berpiztu/wslc-ai-agent

# What is checked: the branches, and the releases people have installed.
watch:
  branches: [main, develop]
  releases: 3

# Where its dependencies are written. Versions are read from there, never copied here.
sources:
  - file: Directory.Packages.props
    kind: nuget
  - file: global.json
    kind: dotnet-sdk
  - file: plugins/wslc-published/Dockerfile
    kind: dockerfile
  - file: plugins/transcribe-cuda/Dockerfile
    kind: dockerfile
  - file: docs/compose/examples/counter/app/Dockerfile
    kind: dockerfile
  - file: docs/compose/examples/counter/app/requirements.txt
    kind: pip
  - file: docs/compose/examples/counter/compose.yaml
    kind: compose
