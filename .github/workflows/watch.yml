name: Watch

# The inventories the projects sent as issues taken in and answered, then
# every inventory's libraries checked once: libraries.json,
# status/<project>.json, history.json and HISTORY.md written and committed,
# and an issue opened for each blocking finding first seen. Every morning,
# for the advisories published since; as soon as a project opens an
# inventory issue, so its next build already knows; by hand; and whenever
# the watcher changes. A commit or an issue made here with the workflow's
# token starts no workflow, so the run never starts itself again.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - projects.txt
      - submitters.txt
      - watch/**
      - .github/workflows/watch.yml

permissions:
  contents: write
  issues: write

# One run at a time, the newest waiting: inventories sent together are
# taken together by the run that follows them, each run taking every open
# inventory issue, so one whose own run was skipped is not lost.
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    # An issue that is not an inventory (a finding, a question) starts nothing.
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'inventory:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check every library
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run watch/watch.cs

      # A project may have sent an inventory while this ran: the results go
      # on top of it.
      - name: Keep the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Watch $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
