name: Watch

# Every morning, every project in projects/ checked at its branches and its
# last releases: status/<project>.json, history.json and HISTORY.md written
# and committed, and an issue opened for each high, critical or .NET
# security-release finding first seen. Also run by hand, and whenever what
# is watched, or how, changes. A commit made here with the workflow's token
# starts no workflow, so the run never starts itself again.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - projects/**
      - watch/**
      - .github/workflows/watch.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The newest .NET 10 SDK: it runs the watcher, and it restores every
      # watched ref, whose global.json rolls forward to it.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check every project
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run watch/watch.cs

      # Committed even when a project failed: the others' results are good,
      # and the failed one's status says why.
      - name: Keep the results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Watch $(date -u +%Y-%m-%d)"
          git push
